<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f4f1" />
    <title>Venus POS</title>
    <script>
      // Production gate (Phase 6+). Skip in Vite dev so the placeholder shell is visible.
      (function () {
        if (location.port === '5173') {
          /* Vite dev: show shell without auth during overhaul */
          return;
        }
        try {
          var raw = localStorage.getItem('venus-pos-auth');
          if (!raw) {
            location.replace('/auth.html?next=' + encodeURIComponent(location.pathname + location.search + location.hash));
            return;
          }
          var s = JSON.parse(raw);
          if (!s || !s.access_token) {
            location.replace('/auth.html?next=' + encodeURIComponent(location.pathname + location.search + location.hash));
          }
        } catch (e) {
          location.replace('/auth.html');
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
