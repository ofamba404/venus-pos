<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · Venus POS</title>
  <meta name="description" content="Staff sign-in for Venus POS.">
  <meta name="theme-color" content="#059669">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Venus POS">
  <meta property="og:title" content="Venus POS">
  <meta property="og:description" content="Private point-of-sale for the Venus team — sign in to continue.">
  <meta property="og:url" content="https://posvenus.netlify.app/auth.html">
  <meta property="og:image" content="https://posvenus.netlify.app/assets/og-venus-pos.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Venus POS">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Venus POS">
  <meta name="twitter:description" content="Private point-of-sale for the Venus team — sign in to continue.">
  <meta name="twitter:image" content="https://posvenus.netlify.app/assets/og-venus-pos.png">
  <link rel="canonical" href="https://posvenus.netlify.app/auth.html">
  <link rel="icon" href="assets/logo-browser.svg?v=5" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=4" sizes="180x180">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Venus POS">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://xiangrykfxlnacthjcad.supabase.co" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/auth/config.js"></script>
  <script src="js/auth/client.js"></script>
  <script src="js/auth/auth-page.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-shell">
    <header class="auth-brand">
      <img class="auth-brand__logo" src="assets/logo.svg" alt="" width="48" height="48" decoding="async">
      <h1 class="auth-brand__title">Venus POS</h1>
      <p class="auth-brand__sub">Staff sign-in</p>
    </header>

    <p class="auth-status" data-auth-status role="alert" aria-live="assertive" hidden></p>

    <section class="auth-panel" aria-label="Sign in" data-auth-panel="login">
      <form class="auth-form" data-auth-form="login" autocomplete="on" novalidate>
        <div class="auth-field">
          <label class="auth-field__label" for="login-email">Email</label>
          <input class="auth-field__input" id="login-email" name="email" type="email" required autocomplete="username" inputmode="email" placeholder="you@example.com">
        </div>
        <div class="auth-field">
          <label class="auth-field__label" for="login-pass">Password</label>
          <div class="auth-pass">
            <input class="auth-field__input" id="login-pass" name="password" type="password" required minlength="6" autocomplete="current-password" placeholder="Your password">
            <button class="auth-pass__toggle" type="button" data-toggle-password="login-pass" aria-controls="login-pass" aria-pressed="false" aria-label="Show password"><svg class="auth-eye auth-eye--show" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="auth-eye auth-eye--hide" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
          </div>
        </div>
        <button class="auth-submit" type="submit"><span class="auth-submit__label">Sign in</span><span class="auth-spinner" aria-hidden="true"></span></button>
      </form>
      <button class="auth-link" type="button" data-auth-goto="forgot">Forgot password?</button>
      <p class="auth-hint">Admin and staff accounts only. Different roles, same sign-in.</p>
    </section>

    <section class="auth-panel" aria-label="Reset password" data-auth-panel="forgot" hidden>
      <form class="auth-form" data-auth-form="forgot" novalidate>
        <p class="auth-hint">Enter your email and we'll send you a link to set a new password.</p>
        <div class="auth-field">
          <label class="auth-field__label" for="forgot-email">Email</label>
          <input class="auth-field__input" id="forgot-email" name="email" type="email" required autocomplete="username" inputmode="email" placeholder="you@example.com">
        </div>
        <button class="auth-submit" type="submit"><span class="auth-submit__label">Send reset link</span><span class="auth-spinner" aria-hidden="true"></span></button>
      </form>
      <button class="auth-link" type="button" data-auth-goto="login">Back to sign in</button>
    </section>

    <section class="auth-panel" aria-label="Change password" data-auth-panel="change" hidden>
      <form class="auth-form" data-auth-form="change" novalidate>
        <p class="auth-hint" data-change-intro>Choose a new password (at least 8 characters).</p>
        <div class="auth-field">
          <label class="auth-field__label" for="new-pass">New password</label>
          <div class="auth-pass">
            <input class="auth-field__input" id="new-pass" name="new_password" type="password" required minlength="8" autocomplete="new-password" placeholder="New password">
            <button class="auth-pass__toggle" type="button" data-toggle-password="new-pass" aria-controls="new-pass" aria-pressed="false" aria-label="Show password"><svg class="auth-eye auth-eye--show" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="auth-eye auth-eye--hide" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
          </div>
        </div>
        <div class="auth-field">
          <label class="auth-field__label" for="confirm-pass">Confirm new password</label>
          <div class="auth-pass">
            <input class="auth-field__input" id="confirm-pass" name="confirm_password" type="password" required minlength="8" autocomplete="new-password" placeholder="Repeat new password">
            <button class="auth-pass__toggle" type="button" data-toggle-password="confirm-pass" aria-controls="confirm-pass" aria-pressed="false" aria-label="Show password"><svg class="auth-eye auth-eye--show" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="auth-eye auth-eye--hide" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7c1.6 0 3-.4 4.3-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
          </div>
        </div>
        <button class="auth-submit" type="submit"><span class="auth-submit__label">Save new password</span><span class="auth-spinner" aria-hidden="true"></span></button>
      </form>
      <button class="auth-link" type="button" data-auth-cancel-change>Back to POS</button>
    </section>
  </main>
</body>
</html>
